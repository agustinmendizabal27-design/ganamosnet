<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Red Estrella</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  .landing {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    background:
      radial-gradient(ellipse 100% 50% at 50% 0%, #8B0000 0%, #4a0000 30%, transparent 60%),
      radial-gradient(ellipse 80% 50% at 20% 50%, #7a3300 0%, transparent 50%),
      radial-gradient(ellipse 80% 50% at 80% 50%, #5c1a00 0%, transparent 50%),
      radial-gradient(ellipse 100% 60% at 50% 100%, #3d1a00 0%, #1a0800 50%, transparent 80%),
      linear-gradient(180deg, #2d0000 0%, #1a0800 35%, #2d1000 65%, #1a0500 100%);
    overflow: hidden;
    font-family: 'Oswald', sans-serif;
  }

  /* FONDO ANIMADO */
  .bg-glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .bg-glow::before {
    content: '';
    position: absolute;
    top: 20%; left: 50%;
    transform: translateX(-50%);
    width: 500px; height: 500px;
    background: radial-gradient(circle, #FF6B0044 0%, #FFD70022 40%, transparent 70%);
    animation: glowPulse 3s ease-in-out infinite alternate;
  }
  .bg-glow::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(circle at 10% 30%, #FF4400aa 0%, transparent 25%),
      radial-gradient(circle at 90% 30%, #FF2200aa 0%, transparent 25%),
      radial-gradient(circle at 50% 70%, #FFD70033 0%, transparent 35%);
    animation: colorShift 4s ease-in-out infinite alternate;
  }
  @keyframes glowPulse {
    from { transform: translateX(-50%) scale(1); opacity: 0.6; }
    to   { transform: translateX(-50%) scale(1.3); opacity: 1; }
  }
  @keyframes colorShift {
    from { opacity: 0.5; }
    to   { opacity: 1; }
  }

  /* MONEDAS FLOTANTES */
  .coins {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .coin {
    position: absolute;
    font-size: 24px;
    animation: coinFloat linear infinite;
    opacity: 0;
    filter: drop-shadow(0 0 6px #FFD700);
  }
  @keyframes coinFloat {
    0%   { transform: translateY(105vh) rotate(0deg); opacity: 0; }
    5%   { opacity: 1; }
    95%  { opacity: 0.8; }
    100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
  }

  /* DESTELLOS */
  .sparkle {
    position: absolute;
    width: 4px; height: 4px;
    background: #FFD700;
    border-radius: 50%;
    animation: sparkleAnim ease-in-out infinite;
    box-shadow: 0 0 6px #FFD700, 0 0 12px #FFD700;
  }
  @keyframes sparkleAnim {
    0%,100% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1); opacity: 1; }
  }

  /* BADGES */
  .badges {
    width: 100%;
    max-width: 420px;
    padding: 14px 12px 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
    position: relative;
    z-index: 2;
  }

  .badge {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    border: 2px solid;
    animation: fadeSlideDown 0.5s ease both;
    position: relative;
    overflow: hidden;
  }
  .badge::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    transform: translateX(-100%);
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    50%,100% { transform: translateX(100%); }
  }
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .badge-icon { font-size: 22px; flex-shrink: 0; }

  .badge-1 {
    background: linear-gradient(135deg, #2a0000dd, #500000dd);
    border-color: #FF6B00;
    color: #FFD700;
    animation-delay: 0.05s;
    box-shadow: 0 0 15px #FF6B0044, inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .badge-2 {
    background: linear-gradient(135deg, #002200dd, #004400dd);
    border-color: #00DD66;
    color: #00FF88;
    animation-delay: 0.15s;
    box-shadow: 0 0 15px #00DD6644, inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .badge-3 {
    background: linear-gradient(135deg, #003300dd, #005500dd);
    border-color: #44FF44;
    color: #88FF88;
    animation-delay: 0.25s;
    box-shadow: 0 0 15px #44FF4444, inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .badge-4 {
    background: linear-gradient(135deg, #FFD700, #FF8C00);
    border-color: #FFD700;
    color: #000;
    font-size: 17px;
    animation-delay: 0.35s;
    box-shadow: 0 0 25px #FFD70088, 0 4px 15px rgba(0,0,0,0.4);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .badge-4:hover { transform: scale(1.02); box-shadow: 0 0 40px #FFD700bb; }

  /* LOGO */
  .logo-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    animation: fadeScaleIn 0.7s ease 0.3s both;
  }
  @keyframes fadeScaleIn {
    from { opacity: 0; transform: scale(0.8); }
    to   { opacity: 1; transform: scale(1); }
  }

  .logo-container {
    position: relative;
    width: min(260px, 62vw);
    height: min(260px, 62vw);
  }

  /* Anillo exterior animado */
  .logo-outer-ring {
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    background: conic-gradient(
      #FFD700 0deg, #FF8C00 60deg, #FF4500 120deg,
      #FFD700 180deg, #FFA500 240deg, #FF6B00 300deg, #FFD700 360deg
    );
    animation: rotateFast 3s linear infinite;
    filter: blur(1px);
  }
  @keyframes rotateFast {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* Anillo interior */
  .logo-inner-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: radial-gradient(circle, #1a0800, #0d0400);
    border: 3px solid #FFD700;
    box-shadow: 0 0 20px #FFD70066, inset 0 0 20px #FFD70022;
  }

  /* Glow detrás del logo */
  .logo-glow {
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: radial-gradient(circle, #FF6B0066 0%, #FFD70033 40%, transparent 70%);
    animation: logoPulse 2s ease-in-out infinite alternate;
  }
  @keyframes logoPulse {
    from { transform: scale(0.9); opacity: 0.7; }
    to   { transform: scale(1.1); opacity: 1; }
  }

  .logo-img {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
  }

  .logo-fallback {
    display: none;
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a0800, #3d1500);
    z-index: 1;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
  }

  /* ACTIVOS */
  .activos-badge {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 24px;
    background: linear-gradient(135deg, rgba(0,0,0,0.7), rgba(50,20,0,0.7));
    border: 1px solid #FFD70066;
    border-radius: 30px;
    color: #FFD700;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    box-shadow: 0 0 15px #FFD70033;
    animation: fadeScaleIn 0.6s ease 0.5s both;
  }
  .activos-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #00FF88;
    box-shadow: 0 0 8px #00FF88, 0 0 16px #00FF8866;
    animation: blink 1.5s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* BOTÓN WA */
  .wa-section {
    width: 100%;
    max-width: 420px;
    padding: 10px 12px 18px;
    position: relative;
    z-index: 2;
    animation: fadeSlideUp 0.6s ease 0.6s both;
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .wa-btn {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: 3px solid #00FF66;
    background: linear-gradient(135deg, #1DB954, #25D366, #128C7E);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    box-shadow:
      0 0 30px rgba(37,211,102,0.6),
      0 0 60px rgba(37,211,102,0.3),
      0 4px 20px rgba(0,0,0,0.5);
    animation: waPulse 2s ease-in-out infinite;
    transition: transform 0.15s;
    position: relative;
    overflow: hidden;
  }
  .wa-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    animation: waShimmer 2.5s ease-in-out infinite;
  }
  @keyframes waShimmer {
    0% { left: -100%; }
    50%,100% { left: 100%; }
  }
  .wa-btn:active { transform: scale(0.97); }
  @keyframes waPulse {
    0%,100% { box-shadow: 0 0 30px rgba(37,211,102,0.6), 0 0 60px rgba(37,211,102,0.3), 0 4px 20px rgba(0,0,0,0.5); }
    50%      { box-shadow: 0 0 50px rgba(37,211,102,0.9), 0 0 80px rgba(37,211,102,0.5), 0 0 0 6px rgba(37,211,102,0.2); }
  }

  .wa-btn-top {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 3px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }
  .wa-btn-top svg { width: 30px; height: 30px; fill: #fff; flex-shrink: 0; }
  .wa-btn-sub {
    color: rgba(255,255,255,0.9);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  }

  .security {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
    color: #ffffff66;
    font-size: 11px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="landing">
  <div class="bg-glow"></div>
  <div class="coins" id="coins"></div>
  <div id="sparkles"></div>

  <!-- BADGES -->
  <div class="badges">
    <div class="badge badge-1">
      <span class="badge-icon">🎰</span>
      <span>Los premios ya están saliendo</span>
    </div>
    <div class="badge badge-2">
      <span class="badge-icon">⚡</span>
      <span>Retiros rápidos</span>
    </div>
    <div class="badge badge-3">
      <span class="badge-icon">✅</span>
      <span>Pagamos todos los premios</span>
    </div>
    <div class="badge badge-4" onclick="abrirWA()">
      <span class="badge-icon">🎯</span>
      <span>¡Probá tu suerte ahora!</span>
    </div>
  </div>

  <!-- LOGO -->
  <div class="logo-wrap">
    <div class="logo-container">
      <div class="logo-glow"></div>
      <div class="logo-outer-ring"></div>
      <div class="logo-inner-ring"></div>
      <img class="logo-img" src="logo.png" alt="Red Estrella"
        onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'" />
      <div id="logo-fallback" class="logo-fallback">
        <div style="font-size:52px;">⭐</div>
        <div style="font-family:'Bebas Neue';font-size:24px;color:#FFD700;letter-spacing:3px;">RED ESTRELLA</div>
      </div>
    </div>
  </div>

  <!-- ACTIVOS -->
  <div class="activos-badge">
    <div class="activos-dot"></div>
    ✦ Activos las 24 hs ✦
  </div>

  <!-- BOTÓN WA -->
  <div class="wa-section">
    <button class="wa-btn" onclick="abrirWA()">
      <div class="wa-btn-top">
        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        HABLAR POR WHATSAPP
      </div>
      <div class="wa-btn-sub">Tocá acá y empezá ahora</div>
    </button>
    <div class="security">🔒 Conexión segura · Respuesta inmediata</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAw6aV8a0aJyrOA_5miXajbojv1JKEJ4jg",
    authDomain: "ganamosnet-12cca.firebaseapp.com",
    projectId: "ganamosnet-12cca",
    storageBucket: "ganamosnet-12cca.firebasestorage.app",
    messagingSenderId: "337775620491",
    appId: "1:337775620491:web:8978522a1ace8e2e8c7f8e"
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const db = getFirestore(app);
  const waMensaje = encodeURIComponent("¡Hola! Quiero jugar en Red Estrella 🎰");
  let waNumeros = [];
  let waIndex = parseInt(localStorage.getItem('gn_wa_idx') || '0');

  onSnapshot(doc(db, 'config', 'whatsapp'), (snap) => {
    if (snap.exists()) waNumeros = snap.data().numeros || [];
  });

  window.abrirWA = function() {
    const activos = waNumeros.filter(n => n.estado === 'activo');
    if (!activos.length) { alert("No hay líneas disponibles. Intentá en unos minutos."); return; }
    const entry = activos[waIndex % activos.length];
    window.open("https://wa.me/" + entry.numero + "?text=" + waMensaje, '_blank');
    waIndex++;
    localStorage.setItem('gn_wa_idx', waIndex);
    const t = Date.now();
    const check = setInterval(() => {
      if (document.visibilityState === 'visible' && Date.now() - t > 1500 && Date.now() - t < 5000) {
        clearInterval(check); waIndex++; localStorage.setItem('gn_wa_idx', waIndex); window.abrirWA();
      }
      if (Date.now() - t > 6000) clearInterval(check);
    }, 500);
  };
</script>

<script>
  // Monedas flotantes
  const coins = document.getElementById('coins');
  const emojis = ['🪙','💰','⭐','💛','🌟'];
  for (let i = 0; i < 20; i++) {
    const c = document.createElement('div');
    c.className = 'coin';
    c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    c.style.cssText = `left:${Math.random()*100}%;font-size:${Math.random()*16+14}px;animation-duration:${Math.random()*8+7}s;animation-delay:${Math.random()*10}s;`;
    coins.appendChild(c);
  }
  // Destellos
  const sp = document.getElementById('sparkles');
  for (let i = 0; i < 15; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${Math.random()*2+1}s;animation-delay:${Math.random()*3}s;`;
    sp.appendChild(s);
  }
</script>
</body>
</html>
